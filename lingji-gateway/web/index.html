<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>灵机</title>
<meta name="theme-color" content="#111318">
<link rel="stylesheet" href="/css/app.css?v=0.1.18">
</head>
<body>
<div id="sidebarOverlay" class="sidebar-overlay" onclick="LingjiUI.closeSidebar()"></div>
<div id="hermesOverlay" class="hermes-overlay"></div>
<div id="app">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">灵机</div>
    <button type="button" id="btnNewChat" class="sidebar-new">+ 新交办</button>
    <div class="job-list-label" id="liveJobsLabel" hidden>进行中</div>
    <div id="jobList" class="job-list" hidden></div>
    <div class="job-list-label">交办</div>
    <div id="sessionList"></div>
  </aside>
  <div class="main-panel">
    <div class="header">
      <button type="button" class="menu-btn" onclick="LingjiUI.toggleSidebar()" aria-label="菜单">☰</button>
      <div class="header-main">
        <h1>灵机</h1>
        <div class="header-meta">
          <div class="status off" id="status">未连接</div>
          <div class="staff-presence" id="staffPresence">员工 · 青铜剑 …</div>
          <button type="button" class="hermes-presence" id="hermesPresence" title="机要栏">机要 · 未启动</button>
          <div class="agent-activity" id="agentActivity" hidden aria-live="polite">
            <span class="agent-activity-dot" aria-hidden="true"></span>
            <span class="agent-activity-label" id="agentActivityLabel"></span>
          </div>
          <select id="agentSelect" class="agent-select debug-only" title="对话调度 Agent" aria-label="对话调度 Agent"></select>
        </div>
      </div>
      <button type="button" id="btnHermesPane" class="hermes-pane-btn" aria-label="机要栏" aria-expanded="false">机要</button>
      <button type="button" id="btnTheme" class="theme-btn" aria-label="切换主题">🌙</button>
    </div>

    <div class="settings" id="settings">
      <label>Gateway:</label>
      <input id="gwHost" value="lingji.mygoal.tech" size="20">
      <input id="gwPort" value="443" size="5">
      <button type="button">连接</button>
    </div>

    <div class="hitl-dock" id="hitlDock" aria-live="polite"></div>

    <div class="chat-wrap">
      <div class="chat" id="chat"></div>
    </div>

    <div class="composer-area">
      <div class="pending-bar" id="pendingBar"></div>
      <div class="toolbar" id="toolbar">
        <label for="fileInput" class="toolbar-btn" title="上传文件">📎</label>
        <input type="file" id="fileInput" class="file-input-visually-hidden" multiple
          accept="image/*,video/*,.pdf,.zip,.doc,.docx,.txt,.md">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="向秘书交办…" autocomplete="off" enterkeyhint="send"></textarea>
          <button type="button" id="btnSend" class="send-btn">发送</button>
        </div>
      </div>
    </div>
  </div>

  <aside id="hermesPane" class="hermes-pane" aria-label="机要" aria-hidden="true" inert>
    <div class="hermes-pane-head">
      <div class="hermes-pane-title">机要</div>
      <button type="button" id="btnHermesCollapse" class="hermes-collapse-btn">收起</button>
    </div>
    <div class="hermes-pane-body">
      <p class="hermes-copy">空城记本机通道。不是第二秘书；跨机事务请走中间栏交给调度。</p>
      <p class="hermes-channel" id="hermesChannel">通道未接通</p>
      <p class="hermes-note" id="hermesNote" hidden></p>
      <button type="button" id="btnHermesPower" class="hermes-power-btn">启动机要</button>
    </div>
    <div class="hermes-composer">
      <textarea id="hermesInput" rows="2" placeholder="通道未接通" disabled></textarea>
    </div>
  </aside>
</div>

<script src="/js/ui.js?v=0.1.18"></script>
<script src="/js/lingji-api.js?v=0.1.18"></script>
<script>
(function () {
  var STORAGE_KEY = 'lingji_theme';
  var btn = document.getElementById('btnTheme');

  function applyTheme(theme) {
    var next = theme === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    if (btn) btn.textContent = next === 'dark' ? '🌙' : '☀️';
    try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
  }

  try {
    applyTheme(localStorage.getItem(STORAGE_KEY) || 'dark');
  } catch (e) {
    applyTheme('dark');
  }

  if (btn) {
    btn.addEventListener('click', function () {
      var current = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });
  }
})();
</script>
<script>LingjiChat.init();</script>
</body>
</html>
